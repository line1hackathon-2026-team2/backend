name: Build and Deploy

on:
  push:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: decision_lab
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/decision_lab
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      # 테스트는 전부 ChatClient를 mock으로 대체하므로 실제 키가 필요 없다. 빈 등록이 되게 더미 값만 넣는다.
      SPRING_AI_ANTHROPIC_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/decisionlab-0.0.1-SNAPSHOT.jar
          retention-days: 7

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: build/libs/decisionlab-0.0.1-SNAPSHOT.jar
          target: /tmp/decisionlab-deploy
          strip_components: 2

      - name: Restart service on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mv /tmp/decisionlab-deploy/decisionlab-0.0.1-SNAPSHOT.jar /opt/decisionlab/app.jar
            sudo systemctl restart decisionlab
            sleep 5
            sudo systemctl is-active --quiet decisionlab
